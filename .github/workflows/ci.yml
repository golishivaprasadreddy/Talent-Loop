name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install, lint, and build
    runs-on: ubuntu-latest

    env:
      # Provide dummy values so Next.js build doesn't fail on missing env vars
      MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/talentloop' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-dummy-secret-32-chars-minimum!!' }}
      OPENAI_API_KEY: ''
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build application
        run: npm run build
